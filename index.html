    const qs = [];
    shuffle(words).slice(0,4).forEach(w => {
      const others = shuffle(words.filter(x=>x!==w)).slice(0,2);
      const opts = shuffle([w, ...others]);

    });

  function getOwnLessonQuestions(level, lessonIdx){
    if (lessonIdx === 1) {
      const wb = WORDS[level+'_L1'];
      return wb ? genVocab(wb) : [];
    }
    if (level === 'A1' && lessonIdx === 4) {
      return genVocab(WORDS.A1_L4);
    }
    if (lessonIdx === 6) {
      const pool = [];
      for (let i = 1; i <= 5; i++) pool.push(...getOwnLessonQuestions(level, i));
      return shuffle(pool).slice(0, 8);
    }
    const arr = FIXED[level] && FIXED[level][lessonIdx];
    return arr ? arr.slice(0, 8) : [];
  }

  function getHigherQuestion(level){
    const idx = LEVELS.indexOf(level);
    const higher = LEVELS.slice(idx + 1);
    if (higher.length === 0) {
      const pool = [];
      for (let i = 1; i <= 5; i++) pool.push(...getOwnLessonQuestions('B2', i));
      return shuffle(pool)[0] || null;
    }
    const hl = higher[Math.floor(Math.random() * higher.length)];
    const lIdx = 1 + Math.floor(Math.random() * 5);
    const pool = getOwnLessonQuestions(hl, lIdx);
    return shuffle(pool)[0] || null;
  }

  function buildLesson(level, lessonIdx){
    const own = getOwnLessonQuestions(level, lessonIdx).slice(0, 8);
    const extra = getHigherQuestion(level);
    const combined = extra ? [...own, extra] : own.slice(0, 9);
    return shuffle(combined).slice(0, 9);
  }

    localStorage.setItem('completedLessons', JSON.stringify(completedLessons));

  function getNodeState(idx){
    if (completedLessons.includes(idx)) return 'completed';
    for (let i = 0; i < idx; i++) {
      if (!completedLessons.includes(i)) return 'locked';
    }
    return 'current';
  }

  function renderPath(){
    const pathEl = document.getElementById('path');
    pathEl.innerHTML = '';
    const totalNodes = 7;

    for (let i = 0; i < totalNodes; i++) {
      const state = getNodeState(i);
      const node = document.createElement('div');
      node.className = 'node ' + state;
      node.dataset.state = state;
      node.dataset.idx = i;

      let title = '';
      if (i === 0) title = 'Тест на уровень';
      else if (userLevel) title = 'Урок ' + i + ': ' + LESSON_META[userLevel][i-1].name;
      else title = 'Урок ' + i;
      node.title = title;

      if (state === 'completed') node.innerHTML = CHECK_SVG;
      else if (state === 'locked') node.innerHTML = LOCK_SVG;
      else {
        if (i === 0) node.innerHTML = TEST_SVG;
        else node.innerHTML = STAR_SVG;
      }

      node.addEventListener('click', () => onNodeClick(i, state));
      pathEl.appendChild(node);
    }

    const badge = document.getElementById('level-badge');
    if (userLevel) { badge.style.display = 'inline-block'; badge.textContent = userLevel; }
    else badge.style.display = 'none';
  }

    const meta = LESSON_META[userLevel][idx-1];
    document.getElementById('lesson-badge').textContent = userLevel + ' · Урок ' + idx;
    document.getElementById('lesson-title').textContent = meta.name;
    document.getElementById('lesson-desc').textContent = meta.desc;
    document.getElementById('lesson-count').textContent = '9 вопросов';
    currentMode = 'lesson';
    currentLessonIdx = idx;
    openOverlay(lessonIntroEl);
  }

  function beginTest(){
    closeOverlay(lessonIntroEl);
    currentQuestions = LEVEL_TEST;
    testTitleEl.textContent = 'Тест на уровень';
    state = { index: 0, correct: 0, answered: false };
    renderQuestion();
    openOverlay(testScreenEl);
  }

  function beginLesson(){
    closeOverlay(lessonIntroEl);
    currentQuestions = buildLesson(userLevel, currentLessonIdx);
    const meta = LESSON_META[userLevel][currentLessonIdx-1];
    testTitleEl.textContent = userLevel + ' · ' + meta.name;
    state = { index: 0, correct: 0, answered: false };
    renderQuestion();
    openOverlay(testScreenEl);
  }

  function renderQuestion(){
    const q = currentQuestions[state.index];
    state.answered = false;
    testFeedbackEl.className = 'test-feedback';
    testFeedbackEl.innerHTML = '';
    testNextBtn.style.display = 'none';
    testCounterEl.textContent = (state.index + 1) + ' / ' + currentQuestions.length;
    testProgressEl.style.width = ((state.index / currentQuestions.length) * 100) + '%';
    testQuestionEl.textContent = q.q;
    testAnswerArea.innerHTML = '';

    if (q.o) {
      const wrap = document.createElement('div');
      wrap.className = 'test-options';
      q.o.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'test-option';
        btn.textContent = String.fromCharCode(65 + i) + ') ' + opt;
        btn.addEventListener('click', () => handleChoice(i, btn));
        wrap.appendChild(btn);
      });
      testAnswerArea.appendChild(wrap);
    } else {
      const row = document.createElement('div');
      row.className = 'test-input-row';
      const input = document.createElement('input');
      input.className = 'test-input';
      input.type = 'text';
      // FIX: нейтральный плейсхолдер, чтобы не подсказывать ответ
      input.placeholder = 'Введи ответ...';
      input.autocomplete = 'off';
      input.autocapitalize = 'off';
      input.spellcheck = false;
      row.appendChild(input);
      const submitBtn = document.createElement('button');
      submitBtn.type = 'button';
      submitBtn.className = 'test-btn-next';
      submitBtn.textContent = 'Проверить';
      submitBtn.addEventListener('click', () => handleInput(input, submitBtn));
      input.addEventListener('keydown', e => { if (e.key === 'Enter') handleInput(input, submitBtn); });
      row.appendChild(submitBtn);
      testAnswerArea.appendChild(row);
      setTimeout(() => input.focus(), 120);
    }
  }

  function handleChoice(idx, btnEl){
    if (state.answered) return;
    state.answered = true;
    const q = currentQuestions[state.index];
    const isCorrect = idx === q.a;
    const all = testAnswerArea.querySelectorAll('.test-option');
    all.forEach(b => b.disabled = true);

    if (isCorrect) {
      state.correct++;
      btnEl.classList.add('selected-correct');
      showCorrectFeedback();
    } else {
      btnEl.classList.add('selected-wrong');
      all[q.a].classList.add('show-correct');
      showWrongFeedback(q.e);
    }
  }

  function handleInput(input, submitBtn){
    if (state.answered) return;
    const value = input.value;
    if (!value.trim()) { input.focus(); return; }
    state.answered = true;
    const q = currentQuestions[state.index];
    const norm = normalize(value);
    const isCorrect = q.ans.some(a => normalize(a) === norm);
    input.disabled = true;
    if (submitBtn) submitBtn.style.display = 'none';

    if (isCorrect) {
      state.correct++;
      input.classList.add('correct');
      showCorrectFeedback();
    } else {
      input.classList.add('wrong');
      showWrongFeedback(q.e);
    }
  }

  function showCorrectFeedback(){
    testFeedbackEl.className = 'test-feedback show correct';
    testFeedbackEl.innerHTML = '<span class="test-feedback-title">✓ Верно!</span>';
    setTimeout(nextQuestion, 900);
  }

  function showWrongFeedback(explanation){
    testFeedbackEl.className = 'test-feedback show wrong';
    testFeedbackEl.innerHTML = '<span class="test-feedback-title">✗ Неверно</span>' + (explanation || '');
    testNextBtn.style.display = 'block';
    testNextBtn.textContent = state.index === currentQuestions.length - 1 ? 'Показать результат' : 'Дальше';
  }

  function nextQuestion(){
    if (state.index >= currentQuestions.length - 1) { finishCurrent(); return; }
    state.index++;
    renderQuestion();
  }

  function finishCurrent(){
    if (currentMode === 'test') finishTest();
    else finishLesson();
  }

  // FIX: теперь после прохождения теста узел 0 становится completed
  // и путь перерисовывается — урок 1 разблокируется
  function finishTest(){
    const score = state.correct;
    let level, desc;
    if (score <= 5) { level = 'A1'; desc = 'Beginner. Ты только начинаешь — старт с базовых фраз и простой грамматики.'; }
    else if (score <= 10) { level = 'A2'; desc = 'Elementary. Ты знаешь основы и можешь объясниться в простых ситуациях.'; }
    else if (score <= 16) { level = 'B1'; desc = 'Intermediate. Ты уверенно общаешься на бытовые темы и понимаешь знакомые тексты.'; }
    else { level = 'B2'; desc = 'Upper-Intermediate. Можешь обсуждать сложные темы и понимать нюансы.'; }

    userLevel = level;
    // FIX: отмечаем тест как пройденный
    if (!completedLessons.includes(0)) completedLessons.push(0);
    saveState();
    // FIX: перерисовываем путь, чтобы узел 0 стал "completed", а урок 1 — "current"
    renderPath();

    closeOverlay(testScreenEl);
    document.getElementById('result-emoji').textContent = '🎉';
    document.getElementById('result-h2').textContent = 'Твой уровень';
    document.getElementById('result-level').textContent = level;
    document.getElementById('result-desc').textContent = desc;
    document.getElementById('result-score').textContent = 'Правильных ответов: ' + score + ' из ' + LEVEL_TEST.length;
    document.getElementById('result-extra').style.display = 'none';
    document.getElementById('finish-test-btn').textContent = 'Начать учиться';
    openOverlay(resultScreenEl);
  }

  function finishLesson(){
    const score = state.correct;
    closeOverlay(testScreenEl);
    const total = currentQuestions.length;
    const passed = score >= Math.ceil(total * 0.6);

    if (passed) {
      if (!completedLessons.includes(currentLessonIdx)) completedLessons.push(currentLessonIdx);
      saveState();
      renderPath();
      const xp = document.getElementById('xp-current');
      const cur = parseInt(xp.textContent) || 0;
      const newXp = Math.min(50, cur + 10);
      xp.textContent = newXp;
      document.getElementById('daily-fill').style.width = (newXp/50*100) + '%';
      const gems = document.getElementById('gems-num');
      const g = parseInt(gems.textContent) || 0;
      gems.textContent = g + 15;

      document.getElementById('result-emoji').textContent = '✨';
      document.getElementById('result-h2').textContent = 'Урок пройден';
      document.getElementById('result-level').textContent = '+1';
      document.getElementById('result-desc').textContent = 'Отлично! Ты справился с уроком «' + LESSON_META[userLevel][currentLessonIdx-1].name + '».';
      document.getElementById('result-score').textContent = 'Правильных: ' + score + ' из ' + total;
      document.getElementById('result-extra').style.display = 'block';
      document.getElementById('result-extra').textContent = '+10 XP · +15 💎';
      document.getElementById('finish-test-btn').textContent = 'Продолжить';
    } else {
      document.getElementById('result-emoji').textContent = '😔';
      document.getElementById('result-h2').textContent = 'Нужно повторить';
      document.getElementById('result-level').textContent = '↻';
      document.getElementById('result-desc').textContent = 'Правильных ' + score + ' из ' + total + '. Нужно минимум ' + Math.ceil(total*0.6) + '. Попробуй ещё раз!';
      document.getElementById('result-score').textContent = 'Правильных: ' + score + ' из ' + total;
      document.getElementById('result-extra').style.display = 'none';
      document.getElementById('finish-test-btn').textContent = 'Попробовать снова';
    }
    openOverlay(resultScreenEl);
  }

  document.getElementById('begin-test-btn').addEventListener('click', () => {
    if (currentMode === 'test') beginTest();
    else beginLesson();
  });
  document.getElementById('cancel-lesson-btn').addEventListener('click', () => closeOverlay(lessonIntroEl));
  testNextBtn.addEventListener('click', nextQuestion);
  document.getElementById('finish-test-btn').addEventListener('click', () => {
    closeOverlay(resultScreenEl);
    if (currentMode === 'lesson') {
      const res = document.getElementById('result-level').textContent;
      if (res === '↻') { openLessonIntroForLesson(currentLessonIdx); }
    }
  });

  document.getElementById('avatar-btn').addEventListener('click', () => {
    if (confirm('Сбросить весь прогресс и начать заново?')) {
      localStorage.clear();
      location.reload();
    }
  });

  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const label = btn.querySelector('span').textContent;
      if (label !== 'Учить') showToast('Раздел «' + label + '» скоро');
    });
  });

  renderPath();

  /* ---------- Кристалл ---------- */
  (function () {
    const cv = document.getElementById('gem-canvas'); if (!cv) return;
    const ctx = cv.getContext('2d');
    const W = 26, H = 30, DPR = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = W * DPR; cv.height = H * DPR; ctx.scale(DPR, DPR);
    const cx = W/2, cy = H/2;
    const N = 6, RA = 1.00, RB = 0.86, YT = 2.25, YA = 0.50, YB = -0.50, YBO = -2.15;
    const ringA = [], ringB = [];
    for (let i = 0; i < N; i++){ const a = (i+0.5)*(Math.PI*2/N); ringA.push({x:Math.cos(a)*RA,y:YA,z:Math.sin(a)*RA}); ringB.push({x:Math.cos(a)*RB,y:YB,z:Math.sin(a)*RB}); }
    const vTop = {x:0,y:YT,z:0}, vBot = {x:0,y:YBO,z:0};
    const faces = [];
    for (let i = 0; i < N; i++){ const j = (i+1)%N; faces.push({v:[vTop,ringA[i],ringA[j]],hue:192}); faces.push({v:[ringA[i],ringB[i],ringB[j],ringA[j]],hue:205}); faces.push({v:[vBot,ringB[j],ringB[i]],hue:216}); }
    const CAM = 7.5, FOC = 44, LX = -0.45, LY = 0.82, LZ = -0.55, TAU = Math.PI*2;
    function frame(now){
      const t = now*0.001, angY = t*1.1, tiltX = 0.34 + Math.sin(t*0.7)*0.06;
      ctx.clearRect(0,0,W,H);
      const gl = ctx.createRadialGradient(cx,cy,0,cx,cy,18);
      gl.addColorStop(0,'rgba(90,200,255,0.25)'); gl.addColorStop(0.5,'rgba(70,140,255,0.10)'); gl.addColorStop(1,'rgba(40,80,255,0)');
      ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(cx,cy,18,0,TAU); ctx.fill();
      const cX = Math.cos(tiltX), sX = Math.sin(tiltX), cY = Math.cos(angY), sY = Math.sin(angY);
      function tr(p){ const y1 = p.y*cX - p.z*sX, z1 = p.y*sX + p.z*cX; return {x:p.x*cY + z1*sY, y:y1, z:-p.x*sY + z1*cY}; }
      function proj(p){ const s = FOC/(p.z + CAM); return {x:cx + p.x*s, y:cy - p.y*s}; }
      const tf = faces.map(f => {
        const vs = f.v.map(tr);
        const ax = vs[1].x-vs[0].x, ay = vs[1].y-vs[0].y, az = vs[1].z-vs[0].z;
        const bx = vs[2].x-vs[0].x, by = vs[2].y-vs[0].y, bz = vs[2].z-vs[0].z;
        let nx = ay*bz - az*by, ny = az*bx - ax*bz, nz = ax*by - ay*bx;
        const nl = Math.hypot(nx,ny,nz)||1; nx/=nl; ny/=nl; nz/=nl;
        let cxg = 0, cyg = 0, czg = 0;
        for (const v of vs){ cxg+=v.x; cyg+=v.y; czg+=v.z; }
        cxg/=vs.length; cyg/=vs.length; czg/=vs.length;
        if (nx*cxg + ny*cyg + nz*czg < 0){ nx=-nx; ny=-ny; nz=-nz; }
        return {hue:f.hue, vs, nx, ny, nz, depth:czg};
      });
      tf.sort((a,b)=>b.depth - a.depth);
      for (const f of tf){
        const diff = Math.max(0, f.nx*LX + f.ny*LY + f.nz*LZ);
        const spec = Math.pow(diff, 18);
        let light = 16 + 58*diff + 50*spec; if (light > 92) light = 92;
        ctx.beginPath();
        const p0 = proj(f.vs[0]); ctx.moveTo(p0.x, p0.y);
        for (let i = 1; i < f.vs.length; i++){ const p = proj(f.vs[i]); ctx.lineTo(p.x, p.y); }
        ctx.closePath();
        ctx.fillStyle = `hsla(${f.hue},82%,${light}%,0.93)`; ctx.fill();
        ctx.lineWidth = 0.6; ctx.strokeStyle = `rgba(190,235,255,${0.18+0.45*diff})`; ctx.stroke();
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();

  /* ---------- Бесконечность ---------- */
  (function () {
    const cv = document.getElementById('life-canvas'); if (!cv) return;
    const ctx = cv.getContext('2d');
    const W = 39, H = 26, DPR = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = W * DPR; cv.height = H * DPR; ctx.scale(DPR, DPR);
    const CX = W/2, CY = H/2, A = 12, YM = 1.40, TAU = Math.PI*2;
    function point(t){ const s = Math.sin(t), c = Math.cos(t), den = 1+s*s; return {x:CX + A*c/den, y:CY - A*YM*(s*c)/den}; }
    const SEG = 200, TWIST = 3, HALF = 2.2, SPEED = 1.9;
    function frame(now){
      const time = now*0.001;
      ctx.clearRect(0,0,W,H); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      const pts = [], nrm = [], hw = [], phi = [];
      for (let i = 0; i <= SEG; i++){
        const t = i/SEG*TAU, p = point(t);
        const e = 0.0008, p1 = point(t+e), p0 = point(t-e);
        let tx = p1.x - p0.x, ty = p1.y - p0.y; const L = Math.hypot(tx,ty)||1; tx/=L; ty/=L;
        pts.push(p); nrm.push({x:-ty, y:tx});
        const ph = TWIST*t + time*SPEED; phi.push(ph); hw.push(HALF*Math.cos(ph));
      }
      for (let i = 0; i < SEG; i++){
        const a = pts[i], b = pts[i+1], na = nrm[i], nb = nrm[i+1], ha = hw[i], hb = hw[i+1];
        const t = i/SEG;
        const hue = 265 + 70*Math.sin(t*TAU - Math.PI/2);
        const face = Math.abs(Math.cos(phi[i]));
        const light = 28 + 46*face;
        ctx.beginPath();
        ctx.moveTo(a.x + na.x*ha, a.y + na.y*ha); ctx.lineTo(b.x + nb.x*hb, b.y + nb.y*hb);
        ctx.lineTo(b.x - nb.x*hb, b.y - nb.y*hb); ctx.lineTo(a.x - na.x*ha, a.y - na.y*ha); ctx.closePath();
        const fill = `hsl(${hue.toFixed(1)},90%,${light.toFixed(1)}%)`;
        ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = 0.6; ctx.strokeStyle = fill; ctx.stroke();
        const hl = 0.42;
        ctx.beginPath();
        ctx.moveTo(a.x + na.x*ha*hl, a.y + na.y*ha*hl); ctx.lineTo(b.x + nb.x*hb*hl, b.y + nb.y*hb*hl);
        ctx.lineTo(b.x - nb.x*hb*hl, b.y - nb.y*hb*hl); ctx.lineTo(a.x - na.x*ha*hl, a.y - na.y*ha*hl); ctx.closePath();
        ctx.fillStyle = `hsla(${hue.toFixed(1)},100%,88%,${0.16 + 0.22*face})`; ctx.fill();
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();
</script>
